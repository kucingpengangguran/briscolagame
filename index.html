<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briscola - Multiplayer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://folks-reservation-jews-needs.trycloudflare.com/socket.io/socket.io.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 750px;
            background: #2b4a36;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding: 12px;
        }

        .ai-hand-area {
            display: flex;
            justify-content: center;
            gap: 8px;
            height: 55px;
            margin-bottom: 4px;
        }

        .card-back {
            width: 38px;
            height: 55px;
            background: repeating-linear-gradient(45deg, #444, #444 4px, #666 4px, #666 8px);
            border-radius: 4px;
            border: 1px solid #333;
        }

        .message-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: #ffeb3b;
            padding: 5px 8px;
            text-align: center;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            box-sizing: border-box;
            min-height: 22px;
            margin-bottom: 4px;
        }

        .external-top-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            padding: 0 4px;
            box-sizing: border-box;
        }

        .turn-counter {
            color: #ffeb3b;
            font-size: 11px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 4px;
        }

        .music-btn {
            background: rgba(0,0,0,0.5);
            color: #ffeb3b;
            border: 1px solid #ffeb3b;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .table-area {
            width: 100%;
            height: 190px;
            background: rgba(0, 0, 0, 0.22);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            box-sizing: border-box;
            position: relative;
            margin-bottom: 6px;
            gap: 10px;
        }

        .table-briscola-slot {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            z-index: 5;
        }

        .briscola-label-container {
            position: absolute;
            top: -18px;
            left: 0;
            font-size: 9px;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .briscola-mini-card {
            width: 38px;
            height: 55px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3px;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid #ccc;
            position: relative;
        }

        .briscola-deck-cover {
            width: 38px;
            height: 55px;
            background: repeating-linear-gradient(45deg, #444, #444 4px, #666 4px, #666 8px);
            border-radius: 4px;
            border: 1px solid #333;
            position: relative;
            left: -18px;
            z-index: 6;
        }

        .winner-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(255, 235, 59, 0.95);
            color: #1a1a1a;
            padding: 6px 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .winner-banner.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .card {
            width: 56px;
            height: 80px;
            background: linear-gradient(135deg, #ffffff 0%, #f7f7f7 100%);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            font-size: 11px;
            position: relative;
            z-index: 5;
            border: 1px solid #cfcfcf;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-inner-art {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            opacity: 0.9;
        }

        .red { color: #d32f2f; }
        .black { color: #111; }

        /* Live Chat Section */
        .chat-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            height: 85px;
            margin-bottom: 6px;
            padding: 4px;
            box-sizing: border-box;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            font-size: 10px;
            color: #fff;
            padding: 2px 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            word-break: break-word;
        }

        .chat-input-row {
            display: flex;
            gap: 4px;
            margin-top: 3px;
        }

        .chat-input-row input {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 3px;
            padding: 3px 6px;
            font-size: 10px;
            outline: none;
        }

        .chat-input-row button {
            background: #ffeb3b;
            border: none;
            border-radius: 3px;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .player-hand-container {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 2px;
        }

        .player-hand {
            display: flex;
            justify-content: center;
            gap: 10px;
            height: 90px;
            width: 100%;
            position: relative;
            z-index: 3;
        }

        .player-hand .card {
            width: 60px;
            height: 88px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .player-hand .card .card-inner-art {
            font-size: 26px;
        }

        .card.fly-from-player {
            animation: playerThrowAnim 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes playerThrowAnim {
            0% { transform: translateY(110px) scale(0.9); opacity: 0.5; }
            100% { transform: translateY(0px) scale(1); opacity: 1; }
        }

        .card.fly-from-ai {
            animation: aiThrowAnim 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes aiThrowAnim {
            0% { transform: translateY(-110px) scale(0.9); opacity: 0.5; }
            100% { transform: translateY(0px) scale(1); opacity: 1; }
        }

        .card.throw-to-corner {
            transition: all 0.4s cubic-bezier(0.6, -0.28, 0.735, 0.045) !important;
            transform: translate(-140px, -70px) scale(0.1) rotate(-90deg) !important;
            filter: blur(4px);
            opacity: 0 !important;
            z-index: 20;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
            text-align: center;
        }

        .modal h2 { color: #ffeb3b; margin-top: 0; }
        .modal button, .modal input {
            background: #ffeb3b;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin: 6px;
            font-size: 13px;
        }
        .modal input { background: #fff; color: #000; text-align: center; width: 160px; }

        .copy-code-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 3px 8px;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<audio id="bg-music" src="monolog.mp3" loop></audio>

<div class="game-container">
    <div class="ai-hand-area" id="ai-hand-area">
        <div class="card-back"></div>
        <div class="card-back"></div>
        <div class="card-back"></div>
    </div>

    <div class="message-box" id="message-box">Silakan buat atau gabung room lobi!</div>

    <div class="external-top-info">
        <div class="turn-counter" id="turn-counter-text">Turn: 1 / 20</div>
        <button class="music-btn" id="music-toggle-btn" onclick="toggleMusic()">🎵 Musik: Mati</button>
    </div>

    <div class="table-area" id="table-area">
        <div class="table-briscola-slot">
            <div class="briscola-label-container">BRISCOLA</div>
            <div class="briscola-mini-card" id="briscola-mini-card"></div>
            <div class="briscola-deck-cover"></div>
        </div>

        <div class="winner-banner" id="winner-banner">YOU WON!</div>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <div style="color: #aaa; font-style: italic;">Live chat aktif...</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Ketik pesan..." onkeypress="handleChatKey(event)">
            <button onclick="sendChatMessage()">Kirim</button>
        </div>
    </div>

    <div class="player-hand-container">
        <div class="player-hand" id="player-hand"></div>
    </div>

    <div class="modal" id="lobby-modal" style="display: flex;">
        <h2>Briscola Multiplayer</h2>
        <p style="font-size: 12px; margin-bottom: 12px; color: #ccc;" id="welcome-sub">Mainkan kartu secara online dengan teman!</p>
        <button onclick="createRoom()">Buat Room Baru</button>
        <div style="margin: 8px 0; font-size: 11px; color: #aaa;">Atau masukkan kode teman:</div>
        <input type="text" id="room-code-input" placeholder="Kode Room">
        <button onclick="joinRoom()">Gabung Room</button>
    </div>

    <div class="modal" id="score-modal">
        <h2>Permainan Selesai!</h2>
        <div id="score-details" style="font-size: 13px; line-height: 1.6; text-align: center; margin-bottom: 15px;"></div>
        <button onclick="location.reload()">Menu Utama</button>
    </div>
</div>

<script>
    const socket = io('https://theme-gnome-animated-exception.trycloudflare.com');

    const tg = window.Telegram.WebApp;
    if (tg && tg.expand) tg.expand();
    const myName = tg.initDataUnsafe?.user?.first_name || "Pemain";
    let oppName = "Lawan";
    let currentRoomCode = "";

    let playerHand = [];
    let isMyTurn = false;
    let briscolaCard = null;

    document.getElementById('welcome-sub').innerText = `Halo, ${myName}! Mainkan kartu secara online.`;

    const bgMusic = document.getElementById('bg-music');
    let musicPlaying = false;

    function toggleMusic() {
        if (!musicPlaying) {
            bgMusic.play().then(() => {
                musicPlaying = true;
                document.getElementById('music-toggle-btn').innerText = "🎵 Musik: Hidup";
            }).catch(e => {
                alert("Gagal memutar musik otomatis. Coba lagi.");
            });
        } else {
            bgMusic.pause();
            musicPlaying = false;
            document.getElementById('music-toggle-btn').innerText = "🎵 Musik: Mati";
        }
    }

    document.body.addEventListener('click', () => {
        if (!musicPlaying) {
            bgMusic.play().then(() => {
                musicPlaying = true;
                document.getElementById('music-toggle-btn').innerText = "🎵 Musik: Hidup";
            }).catch(() => {});
        }
    }, { once: true });

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            socket.emit('syncGame');
        }
    });

    socket.on('reconnect', () => {
        socket.emit('syncGame');
    });

    function playSoundEffect(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'my_turn') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'opponent_turn') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'card_throw') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'round_win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        } catch (e) {
            console.log("Audio diblokir browser.");
        }
    }

    function createRoom() {
        socket.emit('createRoom', myName);
    }

    function joinRoom() {
        const code = document.getElementById('room-code-input').value.trim().toUpperCase();
        if (!code) {
            alert('Masukkan kode room terlebih dahulu!');
            return;
        }
        currentRoomCode = code;
        socket.emit('joinRoom', { code, playerName: myName });
    }

    socket.on('roomCreated', (roomCode) => {
        currentRoomCode = roomCode;
        document.getElementById('lobby-modal').style.display = 'none';
        setMessage(`Room dibuat! Kode: ${roomCode} <button class="copy-code-btn" onclick="copyRoomCode('${roomCode}')">Salin Kode</button>. Menunggu teman masuk...`);
    });

    function copyRoomCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            alert("Kode room berhasil disalin: " + code);
        }).catch(err => {
            alert("Gagal menyalin kode.");
        });
    }

    socket.on('roomJoined', () => {
        document.getElementById('lobby-modal').style.display = 'none';
        setMessage("Berhasil bergabung! Menunggu permainan dimulai...");
    });

    socket.on('errorMsg', (msg) => {
        alert(msg);
    });

    socket.on('gameStart', (data) => {
        document.getElementById('lobby-modal').style.display = 'none';
        playerHand = data.hand;
        briscolaCard = data.briscola;
        isMyTurn = data.isMyTurn;
        oppName = data.oppName;
        
        updateUI(data.turnNumber);
        
        if (isMyTurn) {
            playSoundEffect('my_turn');
            setMessage(`Giliranmu ${myName}!`);
        } else {
            playSoundEffect('opponent_turn');
            setMessage(`Giliran ${oppName}...`);
        }
    });

    socket.on('updateTurnState', (data) => {
        isMyTurn = data.isMyTurn;
        if (isMyTurn) {
            playSoundEffect('my_turn');
            setMessage(`Giliranmu ${myName}!`);
        } else {
            playSoundEffect('opponent_turn');
            setMessage(`Giliran ${oppName}...`);
        }
    });

    function playCard(index) {
        if (!isMyTurn) return;

        // Musik otomatis menyala saat kartu pertama diklik
        if (!musicPlaying) {
            bgMusic.play().then(() => {
                musicPlaying = true;
                document.getElementById('music-toggle-btn').innerText = "🎵 Musik: Hidup";
            }).catch(e => {
                console.log("Gagal memutar musik otomatis.");
            });
        }

        const card = playerHand[index];
        if (!card) return;
        
        playerHand.splice(index, 1);
        isMyTurn = false;
        
        updateUIWithoutHand();

        playSoundEffect('card_throw');

        const tableArea = document.getElementById('table-area');
        const cardEl = renderCardElement(card);
        cardEl.classList.add('fly-from-player');
        tableArea.appendChild(cardEl);

        socket.emit('playCard', card);
    }

    socket.on('cardPlayedOnTable', (card) => {
        playSoundEffect('card_throw');
        const tableArea = document.getElementById('table-area');
        const cardEl = renderCardElement(card);
        cardEl.classList.add('fly-from-ai');
        tableArea.appendChild(cardEl);
    });

    socket.on('turnResolved', (data) => {
        playSoundEffect('round_win');
        const banner = document.getElementById('winner-banner');
        
        if (data.roundWinnerName === myName) {
            banner.innerText = "YOU WON!";
        } else {
            banner.innerText = `${data.roundWinnerName} WON!`;
        }

        banner.classList.add('show');
        setTimeout(() => {
            banner.classList.remove('show');
        }, 1200);

        setTimeout(() => {
            const tableArea = document.getElementById('table-area');
            const cards = tableArea.querySelectorAll('.card');
            cards.forEach(c => c.classList.add('throw-to-corner'));

            setTimeout(() => {
                cards.forEach(c => c.remove());
                playerHand = data.newHand;
                isMyTurn = data.isMyTurn;
                briscolaCard = data.briscola;
                updateUI(data.turnNumber);
                
                if (isMyTurn) {
                    playSoundEffect('my_turn');
                    setMessage(`Giliranmu ${myName}!`);
                } else {
                    playSoundEffect('opponent_turn');
                    setMessage(`Giliran ${oppName}...`);
                }
            }, 600);
        }, 1500);
    });

    socket.on('gameOver', (result) => {
        document.getElementById('score-modal').style.display = 'flex';
        
        let details = `
            <div style="font-size: 16px; color: #ffeb3b; margin-bottom: 10px;"><b>${result.winnerText}</b></div>
            <div>${myName}: <b>${result.myPts} Poin</b></div>
            <div>${oppName}: <b>${result.opponentPts} Poin</b></div>
        `;
        document.getElementById('score-details').innerHTML = details;
    });

    function sendChatMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !currentRoomCode) return;

        socket.emit('sendChat', { roomCode: currentRoomCode, sender: myName, message: text });
        input.value = '';
    }

    function handleChatKey(event) {
        if (event.key === 'Enter') {
            sendChatMessage();
        }
    }

    socket.on('chatMessage', (data) => {
        const chatBox = document.getElementById('chat-messages');
        const msgEl = document.createElement('div');
        msgEl.innerHTML = `<b>${data.sender}:</b> ${data.message}`;
        chatBox.appendChild(msgEl);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    function updateUI(turnNum) {
        const aiArea = document.getElementById('ai-hand-area');
        aiArea.innerHTML = '';
        for (let i = 0; i < 3; i++) {
            aiArea.appendChild(document.createElement('div')).className = 'card-back';
        }

        if (briscolaCard) {
            const miniCardEl = document.getElementById('briscola-mini-card');
            miniCardEl.className = `briscola-mini-card ${briscolaCard.color}`;
            miniCardEl.innerHTML = `
                <div>${briscolaCard.val}${getSymbolHTML(briscolaCard.symbol)}</div>
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px;">${getSymbolHTML(briscolaCard.symbol)}</div>
                <div style="transform: rotate(180deg); align-self: flex-end;">${briscolaCard.val}${getSymbolHTML(briscolaCard.symbol)}</div>
            `;
        }

        document.getElementById('turn-counter-text').innerText = `Turn: ${turnNum} / 20`;

        const handArea = document.getElementById('player-hand');
        handArea.innerHTML = '';
        playerHand.forEach((card, index) => {
            const cardEl = renderCardElement(card);
            cardEl.onclick = () => playCard(index);
            handArea.appendChild(cardEl);
        });
    }

    function updateUIWithoutHand() {
        const handArea = document.getElementById('player-hand');
        handArea.innerHTML = '';
        playerHand.forEach((card, index) => {
            const cardEl = renderCardElement(card);
            cardEl.onclick = () => playCard(index);
            handArea.appendChild(cardEl);
        });
    }

    function getSymbolHTML(symbol) {
        if (symbol === '♠' || symbol === 'spades') return '&spades;';
        if (symbol === '♣' || symbol === 'clubs') return '&clubs;';
        if (symbol === '♦' || symbol === 'diams') return '&diams;';
        if (symbol === '♥' || symbol === 'hearts') return '&hearts;';
        return symbol;
    }

    function renderCardElement(card) {
        const el = document.createElement('div');
        const symHTML = getSymbolHTML(card.symbol);
        el.className = `card ${card.color}`;
        el.innerHTML = `
            <div>${card.val}${symHTML}</div>
            <div class="card-inner-art">${symHTML}</div>
            <div style="transform: rotate(180deg); align-self: flex-end;">${card.val}${symHTML}</div>
        `;
        return el;
    }

    function setMessage(msg) {
        document.getElementById('message-box').innerHTML = msg;
    }
</script>

</body>
</html>
